name: Check Policy YAML Files

on:
  push:
    paths:
      - '**.yaml'
  pull_request:
    paths:
      - '**.yaml'

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Run yamllint
        run: yamllint policies/
